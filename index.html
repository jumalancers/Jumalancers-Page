<!doctype html>
<html lang="es-MX" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      // Con JS, [data-reveal] arranca oculto para animarse. Si la app no hidrata
      // (JS bloqueado o error), se quita la clase y el contenido queda visible.
      (function (d) {
        d.documentElement.classList.add("js");
        setTimeout(function () {
          if (!window.__jmHydrated) d.documentElement.classList.remove("js");
        }, 4000);
      })(document);
    </script>
    <!--app-preload-->
    <!--app-head-->
    <meta name="author" content="Jumalancers (JM Web Studio)" />
    <meta name="theme-color" content="#081613" />
    <meta name="color-scheme" content="dark" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Google Analytics diferido: se carga tras la primera interacción o ~3.5 s después de load -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-1TWXG55VGT");
      (function (w, d) {
        var done = false;
        var evts = ["pointerdown", "keydown", "scroll", "touchstart"];
        function load() {
          if (done) return;
          done = true;
          evts.forEach(function (e) {
            w.removeEventListener(e, load);
          });
          var s = d.createElement("script");
          s.async = true;
          s.src = "https://www.googletagmanager.com/gtag/js?id=G-1TWXG55VGT";
          d.head.appendChild(s);
        }
        evts.forEach(function (e) {
          w.addEventListener(e, load, { once: true, passive: true });
        });
        w.addEventListener("load", function () {
          setTimeout(load, 3500);
        });
      })(window, document);
    </script>
  </head>

  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
